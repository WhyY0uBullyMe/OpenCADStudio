# Agral CAD: programa para Windows, com o Agral Civil dentro do núcleo (decisão do JP em 18/11: sem plugin).
# Gera um ZIP portátil para o JP testar. Roda à mão (Actions > Agral CAD Windows > Run workflow) ou a cada push na
# branch agral-cad.
name: Agral CAD Windows

on:
  workflow_dispatch:
  push:
    branches: [agral-cad]

permissions:
  contents: read

env:
  RUST_MIN_STACK: "67108864"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Icons
        shell: pwsh
        run: |
          magick assets/logo.svg -define icon:auto-resize=16,24,32,48,64,128,256 packaging/windows/AppIcon.ico
          magick -background none -density 1536 assets/mimetypes/image-vnd.dwg.svg -define icon:auto-resize=16,24,32,48,64,128,256 packaging/windows/dwg.ico
          magick -background none -density 1536 assets/mimetypes/image-vnd.dxf.svg -define icon:auto-resize=16,24,32,48,64,128,256 packaging/windows/dxf.ico

      - name: Test Agral Civil
        shell: bash
        run: cargo test --locked --release -p agral_civil_motor

      - name: Build
        shell: bash
        run: cargo build --locked --release

      - name: Package
        shell: bash
        run: |
          d=AgralCAD
          mkdir -p "$d"
          cp target/release/OpenCADStudio.exe "$d/AgralCAD.exe"
          mkdir -p "$d/templates"
          cp packaging/agral/TEMPLATE_JP.dwt "$d/templates/"
          cp LICENSE "$d/"
          printf 'Agral CAD (teste)\nAbra AgralCAD.exe. Aba Civil: Create Surface, Add Contours, Rebuild, Toolspace.\nComandos: CREATESURFACE, ADDSURFACECONTOURS, REBUILDSURFACE, SURFACEPROPERTIES, DELETESURFACE, ZOOMSURFACE, TOOLSPACE.\nBaseado no Open CAD Studio (GPL 3). Codigo: https://github.com/WhyY0uBullyMe/OpenCADStudio/tree/agral-cad\n' > "$d/LEIA-ME.txt"

      - name: Installer (MSI)
        # Se o instalador falhar, o ZIP portátil ainda sai.
        continue-on-error: true
        shell: pwsh
        run: |
          # Versão: 0.<dias desde 2026-01-01>.<número da execução> (MSI aceita até 255.255.65535).
          $dias = [int]((Get-Date) - (Get-Date '2026-01-01')).TotalDays
          $version = "0.$dias.${{ github.run_number }}"
          $wix = $env:WIX
          if (-not $wix) { throw "WiX 3 não encontrado no runner" }
          & (Join-Path $wix "bin\candle.exe") -arch x64 "-dVersion=$version" `
            "-dSource=$((Resolve-Path AgralCAD\AgralCAD.exe).Path)" `
            "-dIcon=$((Resolve-Path packaging\windows\AppIcon.ico).Path)" `
            "-dLicense=$((Resolve-Path packaging\windows\License.rtf).Path)" `
            packaging\agral\AgralCAD.wxs -out AgralCAD.wixobj
          if ($LASTEXITCODE -ne 0) { throw "candle falhou" }
          & (Join-Path $wix "bin\light.exe") AgralCAD.wixobj -ext WixUIExtension -cultures:pt-BR -out AgralCAD-instalador.msi
          if ($LASTEXITCODE -ne 0) { throw "light falhou" }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AgralCAD-instalador
          path: AgralCAD-instalador.msi
          retention-days: 30

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AgralCAD-windows-x64
          path: AgralCAD
          retention-days: 30
